<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despera | Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        :root {
            --accent: #806A4F;
            --primary: #FFFFFF;
            --secondary: #f6f5f4;
            --text-primary: #2f2a25;
            --text-secondary: #77716b;
        }

        body {
            background-color: var(--secondary);
            color: var(--text-primary);
        }

        h1 {
            color: var(--accent);
        }

        .card {
            background-color: var(--primary);
            border: 1px solid #e7e2dc;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(128, 106, 79, 0.12);
        }

        .card-img-top {
            background-color: var(--primary);
            padding: 12px;
        }

        .card-title {
            color: var(--text-primary);
        }

        .text-secondary {
            color: var(--text-secondary) !important;
        }

        .product-price {
            color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--primary);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #69553e;
            border-color: #69553e;
            color: var(--primary);
        }

        .btn-primary:active {
            background-color: #594832 !important;
            border-color: #594832 !important;
        }

        #message {
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <main class="container py-4">
        <h1 class="mb-4">Products</h1>

        <div id="products" class="row g-4"></div>
        <p id="message" class="text-secondary mt-3"></p>
    </main>

    <template id="product-template">
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card h-100">
                <img class="card-img-top product-image" alt="" style="height: 220px; object-fit: contain;">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title product-name"></h5>
                    <p class="card-text text-secondary product-description"></p>
                    <p class="fw-bold fs-5 product-price"></p>
                    <p class="small text-secondary product-stock"></p>

                    <button class="btn btn-primary mt-auto" type="button">
                        View Product
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script>
        async function getProducts() {
            const productsContainer = document.getElementById("products");
            const message = document.getElementById("message");

            try {
                const response = await fetch(
                    "http://localhost:8081/api/products"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch products");
                }

                const products = await response.json();
                const template = document.getElementById("product-template");

                productsContainer.replaceChildren();

                if (products.length === 0) {
                    message.textContent = "No products available.";
                    return;
                }

                message.textContent = "";

                products.forEach(product => {
                    const clone = template.content.cloneNode(true);
                    const image = clone.querySelector(".product-image");

                    image.src = product.image_path;
                    image.alt = product.name;

                    image.onerror = () => {
                        image.onerror = null;
                        image.src = `http://localhost:8081${product.image_path}`;
                    };

                    clone.querySelector(".product-name").textContent =
                        product.name;

                    clone.querySelector(".product-description").textContent =
                        product.description;

                    clone.querySelector(".product-price").textContent =
                        `₱${Number(product.unit_price).toFixed(2)}`;

                    clone.querySelector(".product-stock").textContent =
                        product.stocks > 0
                            ? `${product.stocks} in stock`
                            : "Out of stock";

                    productsContainer.appendChild(clone);
                });
            } catch (error) {
                console.error(error);
                message.textContent =
                    "Unable to load products. Please try again later.";
            }
        }

        getProducts();
    </script>

    <script src="scripts/ui-components/navbar.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
