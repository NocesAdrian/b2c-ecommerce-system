<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Despera Merchandise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/index.css" rel="stylesheet">
  <link href="../css/auth.css" rel="stylesheet">
</head>

<body>

  <main class="auth">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-11 col-xl-10">
          <div class="auth-wrap">
            <div class="row g-0">

              <!-- Brand panel (laptop/desktop) -->
              <div class="col-lg-5 d-none d-lg-block">
                <div class="auth-side h-100">
                  <span class="ring ring-a"></span>
                  <span class="ring ring-b"></span>
                  <i class="bi bi-bag-heart side-icon"></i>
                  <h2 class="mb-3">Join the Despera store.</h2>
                  <p>Save your delivery location once and check out faster every time.</p>
                </div>
              </div>

              <!-- Form -->
              <div class="col-lg-7">
                <div class="auth-form">
                  <a href="index.html" class="auth-brand">Despera</a>
                  <h1>Create account</h1>
                  <p class="sub">It only takes a moment.</p>

                  <form id="create-account-form">
                    <div class="mb-3">
                      <label class="field-label" for="new-username">Username</label>
                      <div class="field">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control" id="new-username" name="username"
                          placeholder="Choose a username" autocomplete="username" minlength="4" required>
                      </div>
                    </div>

                    <div class="mb-3">
                      <label class="field-label" for="new-password">Password</label>
                      <div class="field">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control" id="new-password" name="password"
                          placeholder="Create a password" autocomplete="new-password" minlength="4" required>
                        <div id="account-error" class="text-danger small mt-2" role="alert"></div>
                      </div>
                    </div>

                    <div class="form-check mb-4">
                      <input class="form-check-input" type="checkbox" id="showNewPassword"
                        data-toggle-password="new-password">
                      <label class="form-check-label" for="showNewPassword">Show password</label>
                    </div>

                    <div class="mb-3">
                      <label class="field-label" for="location">Delivery location</label>
                      <div class="field">
                        <i class="bi bi-geo-alt"></i>
                        <input type="text" class="form-control" id="location" name="location"
                          placeholder="Street, barangay, city, province" autocomplete="street-address" required>
                      </div>
                    </div>

                    <div class="d-grid gap-2">
                      <button type="submit" class="btn btn-d btn-block">Create</button>
                      <a href="login.html" class="btn btn-soft btn-block">Cancel</a>
                    </div>

                    <p class="divider-text mt-4 mb-0">Already have an account? <a href="login.html"
                        class="text-accent-link">Login</a></p>
                  </form>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/auth.js"></script>
  <script type="module" src="../api/create-account.js"></script>
  <script type="module" src="../api/logout.js"></script>
  <script type="module" src="../api/delete-sessions.js"></script>
</body>

</html>
