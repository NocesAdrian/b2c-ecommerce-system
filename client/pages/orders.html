<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | Despera Merchandise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/index.css" rel="stylesheet">
  <link href="../css/navbar.css" rel="stylesheet">
  <link href="../css/history.css" rel="stylesheet">
  <link href="../css/orders.css" rel="stylesheet">
</head>

<body>

  <!-- NAVBAR: page title | search bar | hamburger -->
  <header class="app-nav sticky-top">
    <div class="container">
      <div class="app-nav-row">

        <h1 class="page-title">Orders</h1>

        <form class="nav-search" role="search" data-ui-only>
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" id="order-search" placeholder="Search orders" aria-label="Search">
        </form>

        <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu"
          aria-controls="sideMenu" aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>

      </div>
    </div>
  </header>

  <!-- OFFCANVAS (right): ADMIN -->
  <div class="offcanvas offcanvas-end side-menu" tabindex="-1" id="sideMenu" aria-labelledby="sideMenuLabel">

    <div class="side-head">
      <!-- Landscape image logo: swap the src with your own logo file -->
      <img class="logo-landscape" id="sideMenuLabel" alt="Despera Merchandise"
        src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 64'%3E%3Crect width='240' height='64' rx='14' fill='%23F0EDE8'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23806A4F'/%3E%3Ctext x='58' y='38' font-family='system-ui,Segoe UI,sans-serif' font-size='18' font-weight='600' letter-spacing='4' fill='%23332C25'%3EDESPERA%3C/text%3E%3C/svg%3E">
      <button type="button" class="menu-btn menu-btn-sm" data-bs-dismiss="offcanvas" aria-label="Close menu">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="offcanvas-body side-body">

      <!-- username | role -->
      <div class="user-card">
        <div class="avatar"><i class="bi bi-person"></i></div>
        <div class="user-info">
          <div class="user-name" id="username-display">username</div>
          <span class="role-pill">Admin</span>
        </div>
      </div>

      <!-- navigation -->
      <nav class="side-nav" aria-label="Main navigation">
        <a href="admin.html" class="side-link">
          <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>
        <a href="products.html" class="side-link">
          <i class="bi bi-box-seam"></i><span>Products</span>
        </a>
        <a href="orders.html" class="side-link active" aria-current="page">
          <i class="bi bi-receipt"></i><span>Orders</span>
        </a>
        <a href="users.html" class="side-link">
          <i class="bi bi-people"></i><span>Users</span>
        </a>
      </nav>

      <!-- logout -->
      <a class="logout-btn" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>

    </div>
  </div>

  <!-- ORDERS -->
  <main class="container history-page">

    <div class="mb-3">
      <p class="eyebrow mb-2">Admin</p>
      <h2 class="section-title mb-1">All orders</h2>
      <p class="text-muted-d mb-0" id="orders-summary">Loading orders…</p>
    </div>

    <!-- Status filter -->
    <div class="order-filters" id="order-filters" role="tablist" aria-label="Filter orders by status">
      <button type="button" class="filter-chip is-active" data-filter="all" role="tab" aria-selected="true">All <span class="chip-count">0</span></button>
      <button type="button" class="filter-chip" data-filter="pending" role="tab" aria-selected="false"><i class="bi bi-hourglass-split"></i>Pending <span class="chip-count">0</span></button>
      <button type="button" class="filter-chip" data-filter="paid" role="tab" aria-selected="false"><i class="bi bi-check-circle"></i>Paid <span class="chip-count">0</span></button>
      <button type="button" class="filter-chip" data-filter="delivered" role="tab" aria-selected="false"><i class="bi bi-box-seam"></i>Delivered <span class="chip-count">0</span></button>
      <button type="button" class="filter-chip" data-filter="cancelled" role="tab" aria-selected="false"><i class="bi bi-x-circle"></i>Cancelled <span class="chip-count">0</span></button>
    </div>

    <div class="row g-3" id="order-list" aria-live="polite"></div>

    <div class="history-state d-none" id="orders-state">
      <i class="bi bi-inbox" id="orders-state-icon"></i>
      <h3 id="orders-state-title">No orders</h3>
      <p id="orders-state-text"></p>
      <button type="button" class="btn btn-soft d-none" id="orders-retry-btn">Try again</button>
    </div>

  </main>

  <template id="order-card-template">
    <div class="col-12 col-lg-6">
      <article class="order-card order-card-link" role="button" tabindex="0">

        <div class="order-top">
          <div class="order-icon"><i class="bi bi-receipt"></i></div>
          <div class="order-heading">
            <h3 class="order-id"></h3>
            <p class="order-date"></p>
          </div>
          <span class="pill order-status"></span>
        </div>

        <ul class="order-details">
          <li><i class="bi bi-person"></i><span class="order-customer"></span></li>
          <li><i class="bi bi-bag"></i><span class="order-items"></span></li>
          <li><i class="bi bi-geo-alt"></i><span class="order-location"></span></li>
        </ul>

        <div class="order-bottom">
          <span class="order-total-label">Total</span>
          <div class="order-total-wrap">
            <strong class="order-total"></strong>
            <i class="bi bi-chevron-right order-chevron"></i>
          </div>
        </div>

      </article>
    </div>
  </template>

  <!-- ORDER POPUP -->
  <div class="modal fade order-modal" id="orderModal" tabindex="-1" aria-labelledby="orderModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-body">

          <button type="button" class="menu-btn menu-btn-sm modal-close" data-bs-dismiss="modal" aria-label="Close">
            <i class="bi bi-x-lg"></i>
          </button>

          <div class="modal-icon"><i class="bi bi-receipt"></i></div>
          <h2 class="modal-heading" id="orderModalTitle">Order</h2>
          <p class="modal-sub" id="modal-date"></p>

          <div class="modal-pills">
            <span class="pill" id="modal-status"></span>
          </div>

          <!-- Progress: Placed → Paid → Delivered (hidden when cancelled) -->
          <ol class="order-steps" id="order-steps" aria-label="Order progress">
            <li data-step="placed">
              <span class="step-dot"><i class="bi bi-bag-check"></i></span>
              <span class="step-label">Placed</span>
            </li>
            <li data-step="paid">
              <span class="step-dot"><i class="bi bi-wallet2"></i></span>
              <span class="step-label">Paid</span>
            </li>
            <li data-step="delivered">
              <span class="step-dot"><i class="bi bi-box-seam"></i></span>
              <span class="step-label">Delivered</span>
            </li>
          </ol>

          <ul class="modal-info">
            <li><span>Customer</span><strong id="modal-customer"></strong></li>
            <li><span>Delivery</span><strong id="modal-location"></strong></li>
            <li><span>Payment</span><strong id="modal-method"></strong></li>
            <li class="modal-info-total"><span>Total</span><strong id="modal-total"></strong></li>
          </ul>

          <!-- Items in this order -->
          <p class="modal-section-title"><i class="bi bi-bag"></i>Items</p>
          <ul class="modal-items" id="modal-items-list"></ul>
          <p class="modal-note d-none" id="modal-items-note"></p>

          <p class="modal-note d-none" id="modal-note"></p>
          <p class="modal-error d-none" id="modal-error"><i class="bi bi-exclamation-circle"></i><span></span></p>

          <!-- Only shown for paid orders -->
          <div class="d-grid gap-2 d-none" id="modal-actions">
            <button type="button" class="btn btn-d" id="deliver-btn">
              <i class="bi bi-box-seam me-2"></i>Mark as delivered
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script type="module" src="../api/logout.js"></script>
  <script type="module" src="../api/auth.js"></script>
  <script type="module" src="../api/delete-sessions.js"></script>
  <script type="module" src="../api/orders.js"></script>
</body>

</html>
