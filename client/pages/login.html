<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Despera Merchandise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/index.css" rel="stylesheet">
  <link href="../css/auth.css" rel="stylesheet">
</head>

<body>

  <main class="auth">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-11 col-xl-10">
          <div class="auth-wrap">
            <div class="row g-0">

              <!-- Brand panel (laptop/desktop) -->
              <div class="col-lg-5 d-none d-lg-block">
                <div class="auth-side h-100">
                  <span class="ring ring-a"></span>
                  <span class="ring ring-b"></span>
                  <i class="bi bi-wifi side-icon"></i>
                  <h2 class="mb-3">Welcome back to Despera.</h2>
                  <p>Your cart and orders are right where you left them.</p>
                </div>
              </div>

              <!-- Form -->
              <div class="col-lg-7">
                <div class="auth-form">
                  <a href="index.html" class="auth-brand">Despera</a>
                  <h1>Login</h1>
                  <p class="sub">Sign in to continue shopping.</p>

                  <form id="login-form">
                    <div class="mb-3">
                      <label class="field-label" for="username">Username</label>
                      <div class="field">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control" id="username" name="username"
                          placeholder="Enter your username" autocomplete="username" required>
                      </div>
                    </div>

                    <div class="mb-3">
                      <label class="field-label" for="password">Password</label>
                      <div class="field">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control" id="password" name="password"
                          placeholder="Enter your password" autocomplete="current-password" required>
                      </div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-between gap-2 mb-4">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="showPassword"
                          data-toggle-password="password">
                        <label class="form-check-label" for="showPassword">Show password</label>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                      </div>
                    </div>

                    <div class="d-grid gap-2">
                      <button type="submit" class="btn btn-d btn-block">Login</button>
                      <a href="create-account.html" class="btn btn-soft btn-block">Create account</a>
                      <a href="../index.html" class="btn btn-ghost btn-block">Cancel</a>
                    </div>
                  </form>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/auth.js"></script>
  <script type="module" src="../api/login.js"></script>
  <script type="module" src="../api/auth-login.js"></script>
  <script type="module" src="../api/delete-sessions.js"></script>
</body>

</html>
