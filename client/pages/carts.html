<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carts | Despera Merchandise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/index.css" rel="stylesheet">
  <link href="../css/navbar.css" rel="stylesheet">
  <link href="../css/carts.css" rel="stylesheet">
  <link href="../css/checkout-bar.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/view-product.css">
</head>

<body>

  <!-- NAVBAR: page title | search bar | hamburger -->
  <header class="app-nav sticky-top">
    <div class="container">
      <div class="app-nav-row">

        <h1 class="page-title">Carts</h1>

        <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu"
          aria-controls="sideMenu" aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>

      </div>
    </div>
  </header>

  <!-- OFFCANVAS (right): CUSTOMER -->
  <div class="offcanvas offcanvas-end side-menu" tabindex="-1" id="sideMenu" aria-labelledby="sideMenuLabel">

    <div class="side-head">
      <!-- Landscape image logo: swap the src with your own logo file -->
      <img class="logo-landscape" id="sideMenuLabel" alt="Despera Merchandise"
        src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 64'%3E%3Crect width='240' height='64' rx='14' fill='%23F0EDE8'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23806A4F'/%3E%3Ctext x='58' y='38' font-family='system-ui,Segoe UI,sans-serif' font-size='18' font-weight='600' letter-spacing='4' fill='%23332C25'%3EDESPERA%3C/text%3E%3C/svg%3E">
      <button type="button" class="menu-btn menu-btn-sm" data-bs-dismiss="offcanvas" aria-label="Close menu">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="offcanvas-body side-body">

      <!-- username | role -->
      <div class="user-card">
        <div class="avatar"><i class="bi bi-person"></i></div>
        <div class="user-info">
          <div class="user-name" id="username-display">username</div>
          <span class="role-pill">Customer</span>
        </div>
      </div>

      <!-- navigation -->
      <nav class="side-nav" aria-label="Main navigation">
        <a href="customer.html" class="side-link">
          <i class="bi bi-grid"></i><span>Browse</span>
        </a>
        <a href="carts.html" class="side-link active" aria-current="page">
          <i class="bi bi-bag"></i><span>Carts</span>
        </a>
        <a href="history.html" class="side-link">
          <i class="bi bi-clock-history"></i><span>History</span>
        </a>
      </nav>

      <!-- logout -->
      <a class="logout-btn" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>

    </div>
  </div>

  <!-- CART -->
  <main class="container carts-page">

    <a href="customer.html" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to browse
    </a>


    <!-- Cards are rendered here by ../scripts/carts.js -->
    <div class="row g-3" id="cart-list" aria-live="polite"></div>

    <!-- Empty / error state -->
    <div class="cart-state d-none" id="cart-state"></div>

    <!-- Checkout bar: number of items + total + button -->
    <div class="checkout-bar d-none" id="checkout-bar">
      <div class="checkout-bar-inner">
        <div class="bar-info">
          <div class="bar-count"><i class="bi bi-bag-check"></i><span id="bar-count">0 items in your cart</span></div>
          <div class="bar-total" id="bar-total">₱0.00</div>
        </div>
        <a href="checkout.html" class="btn btn-d checkout-btn disabled" id="checkout-btn">
          Checkout <i class="bi bi-arrow-right ms-2"></i>
        </a>
      </div>
    </div>

  </main>

  <!-- CART CARD TEMPLATE (one per cart item) -->
  <template id="cart-card-template">
    <div class="col-12 col-lg-6">
      <article class="cart-card">
        <div class="cart-thumb"><img class="cart-photo" src="" alt="" loading="lazy"></div>
        <div class="cart-info">
          <h3 class="cart-name"></h3>
          <p class="cart-unit"></p>
          <div class="cart-meta">
            <span class="cart-qty-value"></span>
            <strong class="cart-line-total"></strong>
          </div>
          <p class="cart-error d-none" role="alert">Couldn't remove this item. Please try again.</p>
        </div>
        <button type="button" class="cart-remove" aria-label="Remove from cart" title="Remove from cart">
          <i class="bi bi-trash3"></i>
        </button>
      </article>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script type="module" src="../api/carts.js"></script>
  <script type="module" src="../api/logout.js"></script>
  <script type="module" src="../api/auth.js"></script>
  <script type="module" src="../api/delete-sessions.js"></script>
</body>

</html>
