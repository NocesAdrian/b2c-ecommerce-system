<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | Despera Merchandise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/index.css" rel="stylesheet">
  <link href="../css/navbar.css" rel="stylesheet">
  <link href="../css/history.css" rel="stylesheet">
  <link href="../css/users.css" rel="stylesheet">
</head>

<body>

  <!-- NAVBAR: page title | search bar | hamburger -->
  <header class="app-nav sticky-top">
    <div class="container">
      <div class="app-nav-row">

        <h1 class="page-title">Users</h1>

        <form class="nav-search" role="search" data-ui-only>
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" id="user-search" placeholder="Search users" aria-label="Search users">
        </form>

        <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu"
          aria-controls="sideMenu" aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>

      </div>
    </div>
  </header>

  <!-- OFFCANVAS (right): ADMIN -->
  <div class="offcanvas offcanvas-end side-menu" tabindex="-1" id="sideMenu" aria-labelledby="sideMenuLabel">

    <div class="side-head">
      <!-- Landscape image logo: swap the src with your own logo file -->
      <img class="logo-landscape" id="sideMenuLabel" alt="Despera Merchandise"
        src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 64'%3E%3Crect width='240' height='64' rx='14' fill='%23F0EDE8'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23806A4F'/%3E%3Ctext x='58' y='38' font-family='system-ui,Segoe UI,sans-serif' font-size='18' font-weight='600' letter-spacing='4' fill='%23332C25'%3EDESPERA%3C/text%3E%3C/svg%3E">
      <button type="button" class="menu-btn menu-btn-sm" data-bs-dismiss="offcanvas" aria-label="Close menu">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="offcanvas-body side-body">

      <!-- username | role -->
      <div class="user-card">
        <div class="avatar"><i class="bi bi-person"></i></div>
        <div class="user-info">
          <div class="user-name" id="username-display">username</div>
          <span class="role-pill">Admin</span>
        </div>
      </div>

      <!-- navigation -->
      <nav class="side-nav" aria-label="Main navigation">
        <a href="admin.html" class="side-link">
          <i class="bi bi-speedometer2"></i><span>Dashboard</span>
        </a>
        <a href="products.html" class="side-link">
          <i class="bi bi-box-seam"></i><span>Products</span>
        </a>
        <a href="orders.html" class="side-link">
          <i class="bi bi-receipt"></i><span>Orders</span>
        </a>
        <a href="users.html" class="side-link active" aria-current="page">
          <i class="bi bi-people"></i><span>Users</span>
        </a>
      </nav>

      <!-- logout -->
      <a class="logout-btn" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>

    </div>
  </div>

  <!-- ORDERS -->
  <main class="container history-page">

    <div class="users-head">
      <div>
        <p class="eyebrow mb-2">Admin</p>
        <h2 class="section-title mb-1">All users</h2>
        <p class="text-muted-d mb-0" id="users-summary">Loading users…</p>
      </div>
      <button type="button" class="btn btn-d" id="add-user-btn">
        <i class="bi bi-person-plus me-2"></i>Add user
      </button>
    </div>

    <!-- Role filter -->
    <div class="user-filters" id="user-filters" role="tablist" aria-label="Filter users by role">
      <button type="button" class="filter-chip is-active" data-filter="all" role="tab" aria-selected="true">All <span class="chip-count">0</span></button>
      <button type="button" class="filter-chip" data-filter="customer" role="tab" aria-selected="false"><i class="bi bi-person"></i>Customers <span class="chip-count">0</span></button>
      <button type="button" class="filter-chip" data-filter="admin" role="tab" aria-selected="false"><i class="bi bi-shield-check"></i>Admins <span class="chip-count">0</span></button>
    </div>

    <div class="row g-3" id="user-list" aria-live="polite"></div>

    <div class="history-state d-none" id="users-state">
      <i class="bi bi-inbox" id="users-state-icon"></i>
      <h3 id="users-state-title">No users</h3>
      <p id="users-state-text"></p>
      <button type="button" class="btn btn-soft d-none" id="users-retry-btn">Try again</button>
    </div>

  </main>

  <!-- One user card -->
  <template id="user-card-template">
    <div class="col-12 col-md-6 col-lg-4">
      <article class="user-row-card">
        <div class="user-row-top">
          <div class="user-row-avatar"><i class="bi bi-person"></i></div>
          <div class="user-row-heading">
            <h3 class="user-row-name"></h3>
            <p class="user-row-meta"></p>
          </div>
          <span class="pill user-role-pill"><i class="bi"></i><span class="role-text"></span></span>
        </div>
        <div class="admin-actions">
          <button type="button" class="btn btn-soft edit-btn"><i class="bi bi-pencil me-2"></i>Edit</button>
          <button type="button" class="btn btn-soft delete-btn" aria-label="Delete user"><i class="bi bi-trash3"></i></button>
        </div>
      </article>
    </div>
  </template>

  <!-- Add / edit popup -->
  <div class="modal fade order-modal" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-body">

          <button type="button" class="menu-btn menu-btn-sm modal-close" data-bs-dismiss="modal" aria-label="Close">
            <i class="bi bi-x-lg"></i>
          </button>

          <div class="modal-icon"><i class="bi bi-person"></i></div>
          <h2 class="modal-heading" id="userModalTitle">Add user</h2>
          <p class="modal-sub" id="userModalSub">New accounts start as customers.</p>

          <form id="user-form" class="user-form" novalidate>

            <div class="field">
              <label for="field-username">Username</label>
              <input type="text" id="field-username" class="field-input" maxlength="255" autocomplete="off" required>
            </div>

            <div class="field" id="role-field">
              <label for="field-role">Role</label>
              <select id="field-role" class="field-input">
                <option value="2">Customer</option>
                <option value="1">Admin</option>
              </select>
            </div>

            <div class="field">
              <label for="field-password" id="password-label">Password</label>
              <div class="password-wrap">
                <input type="password" id="field-password" class="field-input" autocomplete="new-password">
                <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <p class="field-hint mb-0 mt-1 d-none" id="password-hint">Leave empty to keep the current password.</p>
            </div>

            <p class="modal-error d-none" id="user-form-error"><i class="bi bi-exclamation-circle"></i><span></span></p>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-d" id="save-user-btn">Create user</button>
              <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
            </div>

          </form>

        </div>
      </div>
    </div>
  </div>

  <!-- Delete popup -->
  <div class="modal fade order-modal" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body">

          <div class="modal-icon"><i class="bi bi-person-x"></i></div>
          <h2 class="modal-heading" id="deleteUserTitle">Delete user?</h2>
          <p class="modal-sub" id="delete-user-text">This can't be undone.</p>

          <p class="modal-error d-none" id="delete-user-error"><i class="bi bi-exclamation-circle"></i><span></span></p>

          <div class="d-grid gap-2">
            <button type="button" class="btn btn-d" id="confirm-delete-user-btn">Delete</button>
            <button type="button" class="btn btn-soft" data-bs-dismiss="modal">Keep user</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script type="module" src="../api/logout.js"></script>
  <script type="module" src="../api/auth.js"></script>
  <script type="module" src="../api/delete-sessions.js"></script>
  <script type="module" src="../api/users.js"></script>
</body>

</html>
