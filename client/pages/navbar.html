<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Despera Merchandise</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/index.css" rel="stylesheet">
  <link href="../css/navbar.css" rel="stylesheet">
</head>

<body>

  <!-- NAVBAR: page title | search bar | hamburger -->
  <header class="app-nav sticky-top">
    <div class="container">
      <div class="app-nav-row">

        <h1 class="page-title" id="pageTitle">Browse</h1>

        <form class="nav-search" role="search" data-ui-only>
          <i class="bi bi-search"></i>
          <input type="search" class="form-control" placeholder="Search merchandise" aria-label="Search">
        </form>

        <button class="menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sideMenu"
          aria-controls="sideMenu" aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>

      </div>
    </div>
  </header>

  <!-- OFFCANVAS (right) -->
  <div class="offcanvas offcanvas-end side-menu" tabindex="-1" id="sideMenu" aria-labelledby="sideMenuLabel">

    <div class="side-head">
      <!-- Landscape image logo: swap the src with your own logo file -->
      <img class="logo-landscape" id="sideMenuLabel" alt="Despera Merchandise"
        src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 64'%3E%3Crect width='240' height='64' rx='14' fill='%23F0EDE8'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23FFFFFF'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%23806A4F'/%3E%3Ctext x='58' y='38' font-family='system-ui,Segoe UI,sans-serif' font-size='18' font-weight='600' letter-spacing='4' fill='%23332C25'%3EDESPERA%3C/text%3E%3C/svg%3E">
      <button type="button" class="menu-btn menu-btn-sm" data-bs-dismiss="offcanvas" aria-label="Close menu">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="offcanvas-body side-body">

      <!-- username | role -->
      <div class="user-card">
        <div class="avatar"><i class="bi bi-person"></i></div>
        <div class="user-info">
          <div class="user-name" id="userName">username</div>
          <span class="role-pill" id="userRole">Customer</span>
        </div>
      </div>

      <!-- navigation (rendered by navbar.js based on role) -->
      <nav class="side-nav" id="sideNav" aria-label="Main navigation"></nav>

      <!-- logout -->
      <a href="login.html" class="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>

    </div>
  </div>

  <!-- Demo page content (replace with your page) -->
  <main class="container demo-main">
    <div class="demo-card">
      <p class="eyebrow mb-2">Preview</p>
      <h2 class="section-title mb-2" id="demoHeading">Browse</h2>
      <p class="text-muted-d mb-4">Page content goes here. Open the menu on the right to switch pages.</p>

      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="small text-muted-d me-1">Preview as</span>
        <button class="btn btn-soft role-switch active" data-role="customer">Customer</button>
        <button class="btn btn-soft role-switch" data-role="admin">Admin</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/navbar.js"></script>
  <script type="module" src="../api/delete-sessions.js"></script>
</body>

</html>
